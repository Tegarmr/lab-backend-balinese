server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. TAMBAHKAN INI: Resolver Docker agar Nginx selalu mengecek IP setiap 5 detik
    resolver 127.0.0.11 valid=5s;

    # Gzip compression for smaller payloads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # SPA fallback — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        # 2. TAMBAHKAN INI: Simpan alamat host ke dalam variabel
        set $backend_api "http://backend:8000";
        
        # 3. UBAH INI: Panggil variabelnya.
        # (Nginx akan otomatis meneruskan sisa URL seperti /api/transliterate ke backend)
        proxy_pass $backend_api;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long timeout for model inference (can take 30-120s)
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;

        # Large body for image uploads
        client_max_body_size 15M;
    }

    # Proxy health endpoint
    location /health {
        # Terapkan trik variabel yang sama di sini
        set $backend_health "http://backend:8000";
        proxy_pass $backend_health;
        
        proxy_set_header Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}